org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Force Firebase libraries to use compileSdk 36
android.defaults.compileSdk=36
# Bypass compileSdk check for Firebase dependencies
android.nonTransitiveRClass=false
# Do not attempt to download missing SDK components (build-tools, platform, NDK).
# dl.google.com is not reachable on this network, and each failed attempt stalls the
# build for several minutes while it retries the SDK repository manifests.
android.builder.sdkDownload=false
